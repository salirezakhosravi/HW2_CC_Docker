# New compose.yaml 

services:
  app:
    build: .
    environment:
      PORT: "8000"
      DATA_DIR: ./data
    volumes:
      - data-queue:/srv/data

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${PORT_APP}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  data-queue: